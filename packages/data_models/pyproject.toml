[project]
name = "data-models"
version = "0.1.0"
description = "Holds data models such as sensor readings and devices."
readme = "README.md"
authors = [
    { name = "jtoobias", email = "rustusjit@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
data-models = "data_models:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"
