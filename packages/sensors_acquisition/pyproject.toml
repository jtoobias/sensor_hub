[project]
name = "sensor-acquisition"
version = "0.1.0"
description = "Python package to read sensor data and push it to backend"
authors = [
    { name = "Jonathan", email = "rustusjit@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
keywords = ["sensor", "raspberrypi", "mqtt", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "pydantic>=2.5,<3.0",
    "paho-mqtt>=2.0",
    "requests>=2.32,<3.0",
    "ipython>=9.7.0",
    "pydantic-core>=2.41.5",
    "pydantic-settings>=2.12.0",
]
