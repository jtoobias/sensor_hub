[project]
name = "sensor-acquisition"
version = "0.1.0"
description = "Python package to read sensor data and push it to backend"
authors = [
    { name = "Jonathan", email = "rustusjit@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
keywords = ["sensor", "raspberrypi", "mqtt", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License"
]

[project.dependencies]
pydantic = "^2.5"
paho-mqtt = "^1.7"
requests = "^2.32"

[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Optional: package-specific dev tools
dependencies = ["pytest", "ruff"]