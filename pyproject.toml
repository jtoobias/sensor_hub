[project]
name = "sensor-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["sensor-acquisition"]


[tool.uv.sources]
sensor-acquisition = { workspace = true }
backend = { workspace = true }
frontend = { workspace = true }
data_models = { workspace = true }

[dependency-groups]
backend = ["backend"]
sensor_acquisition = ["sensor-acquisition"]
frontend = ["frontend"]

[tool.uv.workspace]
members = [
    "packages/sensors_acquisition",
    "packages/frontend",
    "packages/backend",
    "packages/data_models",
]

[tool.ruff]
# Files/folders to check
src = "src"
tests = "tests"

# Maximum line length
line-length = 88

# Rules to enable
select = ["E", "F", "W", "TYP"]  # E/F/W = style errors/warnings, TYP = type checking

# Rules to ignore (optional)
ignore = ["E203", "W503"]  # common conflicts with black-style formatting

# Auto-fix settings
fix = true

# Optional: exclude virtual environments or build dirs
exclude = ["venv", ".nox"]
